services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Point at the compose db service (not localhost).
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jobtracker
      ENVIRONMENT: development
    # Apply migrations, then serve. DB is guaranteed healthy via depends_on above.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # Lightweight browser-based DB viewer for local dev (http://localhost:8080).
  # Login: System=PostgreSQL, Server=db, User=postgres, Password=postgres, DB=jobtracker.
  adminer:
    image: adminer:4
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  pgdata:

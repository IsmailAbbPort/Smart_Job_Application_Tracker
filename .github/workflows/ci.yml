name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Test (pytest)
        run: uv run pytest

      # Exercise the eval runner itself (metrics + gate thresholds are covered by
      # pytest above; this proves the CLI wires up offline). Real-API eval runs are
      # manual/local so CI never spends API budget. See evals/README.md.
      - name: Eval harness (offline smoke)
        run: uv run python -m evals.run --offline

  # Build the real production image so a broken import, out-of-date uv.lock, or a
  # frontend compile/asset error fails CI instead of crashing the deploy. Stage 1
  # of the Dockerfile runs `npm ci && npm run build` (tsc -b && vite build), so this
  # gates the frontend build too; stage 2 runs `uv sync --frozen`.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t smart-job-tracker:ci .
